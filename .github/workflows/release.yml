name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  aur-package:
    name: Build AUR Package
    runs-on: ubuntu-latest
    needs: pypi
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel git python-build python-installer python-wheel python-setuptools
          useradd -m builder
          chown -R builder:builder .

      - name: Build package
        run: |
          su builder -c "python -m build --wheel --no-isolation"
          cd aur
          su builder -c "makepkg -s --noconfirm --skipinteg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zfspin-aur-package
          path: aur/*.pkg.tar.zst

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pypi, aur-package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download AUR package
        uses: actions/download-artifact@v4
        with:
          name: zfspin-aur-package
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/*.pkg.tar.zst
          generate_release_notes: true
