name: Release

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Run tests before release
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  version-bump:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    needs: test
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Latest tag: ${LATEST_TAG}"

      - name: Get merged branch name
        id: get_branch
        run: |
          MERGE_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Merge commit message: $MERGE_COMMIT_MSG"

          if [[ "$MERGE_COMMIT_MSG" =~ from\ [^/]+/((feature|bugfix|hotfix)/[^[:space:]\']+) ]]; then
            BRANCH="${BASH_REMATCH[1]}"
          elif [[ "$MERGE_COMMIT_MSG" =~ Merge\ (feature|bugfix|hotfix)/([^[:space:]]+) ]]; then
            BRANCH="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          else
            BRANCH="patch"
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "Detected branch: $BRANCH"

      - name: Calculate new version
        id: bump
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          CURRENT="${{ steps.get_tag.outputs.latest_tag }}"
          CURRENT="${CURRENT#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [[ "$BRANCH" == feature/* ]]; then
            BUMP_TYPE="minor"
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "$BRANCH" == bugfix/* ]] || [[ "$BRANCH" == hotfix/* ]]; then
            BUMP_TYPE="patch"
            PATCH=$((PATCH + 1))
          else
            BUMP_TYPE="patch"
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "bump_type=${BUMP_TYPE}" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP_TYPE"
          echo "New version: $NEW_VERSION"

      - name: Update version in pyproject.toml
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          sed -i "s/^version = .*/version = \"${NEW_VERSION}\"/" pyproject.toml

      - name: Commit and tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git diff --staged --quiet || git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin HEAD
          git push origin "v${NEW_VERSION}"

  # Build packages using Docker
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new_tag }}

      - name: Build AUR package
        run: |
          mkdir -p dist/arch
          docker build -t zfspin-arch-builder -f packaging/arch/Dockerfile .
          docker run --rm \
            -e VERSION=${{ needs.version-bump.outputs.new_version }} \
            -v $(pwd)/dist/arch:/output \
            zfspin-arch-builder

      - name: Build Debian package
        run: |
          mkdir -p dist/debian
          docker build -t zfspin-debian-builder -f packaging/debian/Dockerfile .
          docker run --rm \
            -e VERSION=${{ needs.version-bump.outputs.new_version }} \
            -v $(pwd)/dist/debian:/output \
            zfspin-debian-builder

      - name: Upload AUR package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/arch/*.pkg.tar.zst

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/debian/*.deb

  # Build Python package
  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: version-bump
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload Python package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  # Publish to PyPI
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [version-bump, build-python]
    permissions:
      id-token: write
    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Create GitHub release with all artifacts
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-bump, build-packages, build-python, pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new_tag }}
          fetch-depth: 0

      - name: Get changelog
        id: changelog
        run: |
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10)
          fi
          echo "$CHANGELOG" > changelog.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy Python packages
          cp artifacts/python-package/* release/ 2>/dev/null || true

          # Copy AUR package
          cp artifacts/arch-package/*.pkg.tar.zst release/ 2>/dev/null || true

          # Copy Debian package
          cp artifacts/debian-package/*.deb release/ 2>/dev/null || true

          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-bump.outputs.new_tag }}
          name: Release ${{ needs.version-bump.outputs.new_tag }}
          body_path: changelog.txt
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
