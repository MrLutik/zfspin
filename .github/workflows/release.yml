name: Release

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'

jobs:
  version-bump:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Latest tag: ${LATEST_TAG}"

      - name: Get merged branch name
        id: get_branch
        run: |
          MERGE_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Merge commit message: $MERGE_COMMIT_MSG"

          if [[ "$MERGE_COMMIT_MSG" =~ from\ [^/]+/((feature|bugfix|hotfix)/[^[:space:]\']+) ]]; then
            BRANCH="${BASH_REMATCH[1]}"
          elif [[ "$MERGE_COMMIT_MSG" =~ Merge\ (feature|bugfix|hotfix)/([^[:space:]]+) ]]; then
            BRANCH="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          else
            BRANCH="patch"
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "Detected branch: $BRANCH"

      - name: Calculate new version
        id: bump
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          CURRENT="${{ steps.get_tag.outputs.latest_tag }}"
          CURRENT="${CURRENT#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [[ "$BRANCH" == feature/* ]]; then
            BUMP_TYPE="minor"
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "$BRANCH" == bugfix/* ]] || [[ "$BRANCH" == hotfix/* ]]; then
            BUMP_TYPE="patch"
            PATCH=$((PATCH + 1))
          else
            BUMP_TYPE="patch"
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "bump_type=${BUMP_TYPE}" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP_TYPE"
          echo "New version: $NEW_VERSION"

      - name: Update version in pyproject.toml
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          sed -i "s/^version = .*/version = \"${NEW_VERSION}\"/" pyproject.toml

      - name: Commit and tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git diff --staged --quiet || git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin HEAD
          git push origin "v${NEW_VERSION}"

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  aur-package:
    name: Build AUR Package
    runs-on: ubuntu-latest
    needs: [version-bump, pypi]
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new_tag }}

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel git python-build python-installer python-wheel python-setuptools
          useradd -m builder
          chown -R builder:builder .

      - name: Build package
        run: |
          su builder -c "python -m build --wheel --no-isolation"
          cd aur
          su builder -c "makepkg -s --noconfirm --skipinteg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zfspin-aur-package
          path: aur/*.pkg.tar.zst

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-bump, pypi, aur-package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new_tag }}

      - name: Download AUR package
        uses: actions/download-artifact@v4
        with:
          name: zfspin-aur-package
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version-bump.outputs.new_tag }}
          files: ./release/*.pkg.tar.zst
          generate_release_notes: true
