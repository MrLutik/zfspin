name: Build and Release

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Automatically create PR for feature/bugfix/hotfix branches
  create-pr:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract branch info
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BRANCH_TYPE=$(echo "$BRANCH_NAME" | cut -d'/' -f1)
          BRANCH_DESC=$(echo "$BRANCH_NAME" | cut -d'/' -f2-)
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "desc=$BRANCH_DESC" >> $GITHUB_OUTPUT

      - name: Check if PR exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head "${{ steps.branch.outputs.name }}" --json number --jq 'length')
          echo "exists=$PR_EXISTS" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "[${{ steps.branch.outputs.type }}] ${{ steps.branch.outputs.desc }}" \
            --body "## Summary
          Automated PR for \`${{ steps.branch.outputs.name }}\`

          ## Type
          - [x] ${{ steps.branch.outputs.type }}

          ## Checklist
          - [ ] Code reviewed
          - [ ] Tests pass
          - [ ] Documentation updated (if needed)"

  # Run tests on all pushes and PRs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linter
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      - name: Run tests with coverage
        run: pytest tests/ --cov=zfspin --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build Python package artifacts
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  # Build packages on merge to main or tag
  build-packages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            VERSION="${LAST_TAG#v}-$(git rev-list ${LAST_TAG}..HEAD --count)-g${GITHUB_SHA::8}"
          else
            VERSION="0.0.0-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build AUR package
        run: |
          mkdir -p dist/arch
          docker build -t zfspin-arch-builder -f packaging/arch/Dockerfile .
          docker run --rm \
            -e VERSION=${{ steps.version.outputs.version }} \
            -v $(pwd)/dist/arch:/output \
            zfspin-arch-builder

      - name: Build Debian package
        run: |
          mkdir -p dist/debian
          docker build -t zfspin-debian-builder -f packaging/debian/Dockerfile .
          docker run --rm \
            -e VERSION=${{ steps.version.outputs.version }} \
            -v $(pwd)/dist/debian:/output \
            zfspin-debian-builder

      - name: Upload AUR package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/arch/*.pkg.tar.zst

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/debian/*.deb

  # Create release on merge to main
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, build-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and changelog
        id: info
        run: |
          # Get version
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            VERSION="${LAST_TAG#v}-$(git rev-list ${LAST_TAG}..HEAD --count)-g${GITHUB_SHA::8}"
            CHANGELOG=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          else
            VERSION="0.0.0-${GITHUB_SHA::8}"
            CHANGELOG=$(git log --pretty=format:"- %s" -10)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Write changelog to file for multiline support
          echo "$CHANGELOG" > changelog.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy Python packages
          cp artifacts/python-package/* release/ 2>/dev/null || true

          # Copy AUR package
          cp artifacts/arch-package/*.pkg.tar.zst release/ 2>/dev/null || true

          # Copy Debian package
          cp artifacts/debian-package/*.deb release/ 2>/dev/null || true

          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: Release v${{ steps.info.outputs.version }}
          body_path: changelog.txt
          files: release/*
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
